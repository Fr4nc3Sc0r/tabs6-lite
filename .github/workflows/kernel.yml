name: Build kernel only (gta4xlwifi)

# Compiles the pinned kernel with the patches in
# overlay/platform/exynos9611/patches/kernel and uploads the raw Image.
# Needs no Samsung firmware: use it to validate kernel changes quickly.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "overlay/platform/exynos9611/patches/kernel/**"
      - "tools/build_kernel.sh"

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq bc bison clang flex libelf-dev libssl-dev lld llvm
      - name: Build
        run: ./tools/build_kernel.sh "$RUNNER_TEMP/kernel-out"
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/kernel-out/Image
            ${{ runner.temp }}/kernel-out/config
            ${{ runner.temp }}/kernel-out/version.txt
